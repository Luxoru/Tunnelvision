openapi: 3.0.3
info:
  title: TunnelVision
  description: |
    Whether an IP address is a VPN, Tor exit, proxy, datacenter or abusive network.
    There's no authentication, so only expose this to the applications that call it.
  version: 1.0.0
  license:
    name: See the repository
    url: https://github.com/Luxoru/Tunnelvision
servers:
  - url: /
tags:
  - name: Checks
    description: Check addresses
  - name: Sources
    description: The lists addresses are checked against

paths:
  /v1/check/{ip}:
    get:
      tags: [ Checks ]
      operationId: checkAddress
      summary: Check an address
      description: Whether an IPv4 or IPv6 address is a VPN, Tor exit, proxy, datacenter or abusive network.
      parameters:
        - name: ip
          in: path
          required: true
          description: An IPv4 or IPv6 address, not a CIDR block
          schema:
            type: string
            example: 23.27.54.9
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verdict'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/check:
    post:
      tags: [ Checks ]
      operationId: checkAddresses
      summary: Check up to 1000 addresses at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCheckRequest'
      responses:
        '200':
          description: A verdict for each address, in the same order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/sources:
    get:
      tags: [ Sources ]
      operationId: listSources
      summary: The state of every source
      responses:
        '200':
          description: Every source, in the order they're checked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceStatus'

components:
  responses:
    BadRequest:
      description: The request was invalid, e.g. not an IP address
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Verdict:
      type: object
      required: [ ip, risk, blocked, status, categories, detections ]
      properties:
        ip:
          type: string
          description: The address, in canonical form
          example: 23.27.54.9
        risk:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: The weight of the strongest signal, signals don't stack
          example: 0.75
        blocked:
          type: boolean
          description: Whether the block policy says to block this address
        status:
          $ref: '#/components/schemas/VerdictStatus'
        categories:
          type: array
          description: Every kind of match
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Category'
          example: [ VPN, HOSTING ]
        provider:
          type: string
          nullable: true
          description: The VPN provider, when its own server list matched
        detections:
          type: array
          description: The matches that counted towards this verdict
          items:
            $ref: '#/components/schemas/Detection'

    VerdictStatus:
      type: string
      description: CHECKED, or ALLOWLISTED or RESERVED for addresses that are skipped and always clean
      enum: [ CHECKED, ALLOWLISTED, RESERVED ]

    Category:
      type: string
      enum: [ VPN, TOR, RELAY, PROXY, HOSTING, ABUSE ]

    Confidence:
      type: string
      description: CONFIRMED when the list is authoritative, e.g. a provider's own servers
      enum: [ CONFIRMED, LIKELY ]

    Detection:
      type: object
      required: [ source, name, category, confidence, match ]
      properties:
        source:
          type: string
          description: The id of the source that matched
          example: x4b-vpn
        name:
          type: string
          example: X4BNet VPN list
        category:
          $ref: '#/components/schemas/Category'
        confidence:
          $ref: '#/components/schemas/Confidence'
        match:
          type: string
          description: The block or address that matched
          example: 23.27.54.0/24

    BatchCheckRequest:
      type: object
      required: [ ips ]
      properties:
        ips:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
          example: [ 23.27.54.9, 1.1.1.1 ]

    BatchCheckResponse:
      type: object
      required: [ verdicts ]
      properties:
        verdicts:
          type: array
          items:
            $ref: '#/components/schemas/Verdict'

    SourceStatus:
      type: object
      required: [ id, name, category, confidence, state, entries, blocks ]
      properties:
        id:
          type: string
          example: x4b-vpn
        name:
          type: string
          example: X4BNet VPN list
        category:
          $ref: '#/components/schemas/Category'
        confidence:
          $ref: '#/components/schemas/Confidence'
        state:
          type: string
          description: |
            PENDING: not loaded yet. ACTIVE: in use. STALE: too old to trust, ignored until a refresh succeeds.
            FAILED: never loaded, the first refresh failed.
          enum: [ PENDING, ACTIVE, STALE, FAILED ]
        entries:
          type: integer
          description: How many entries the source has
        blocks:
          type: integer
          description: How many blocks those merge into
        refreshedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
          description: Why the last refresh failed, cleared once one succeeds

    Problem:
      type: object
      description: An RFC 9457 problem detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
