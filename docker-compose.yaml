services:
  tunnelvision:
    build: .
    image: tunnelvision:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      TUNNELVISION_CACHE_TYPE: redis
      TUNNELVISION_CACHE_REDIS_URI: redis://valkey:6379
    volumes:
      - tunnelvision-data:/app/data
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: [ "valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tunnelvision-data:
